name: Zuno Release AAB
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare app
        run: |
          mkdir www && cp zuno.html www/index.html
          npm init -y
          npm i @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          printf '{"appId":"com.rafat.zuno","appName":"Zuno","webDir":"www","server":{"url":"%s"}}' "$APP_URL" > capacitor.config.json
          npx cap add android
          npm i -D @capacitor/assets
          mkdir -p assets && cp icon.png assets/icon.png
          npx capacitor-assets generate --android --iconBackgroundColor '#6c4cff' --iconBackgroundColorDark '#6c4cff'
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>|' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          npx cap sync android
      - name: Build signed AAB
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cd android && chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: aab-${{ github.run_number }}
          name: Zuno AAB ${{ github.run_number }}
          files: android/app/build/outputs/bundle/release/app-release.aab
