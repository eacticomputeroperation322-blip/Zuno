 r.innerHTML=`<div class="shell"><div class="side">${S.online?'':'<div class="bn">You’re offline. Messages will send when you reconnect.</div>'}<div class="hd"><h1>${(TABS.find(t=>t[0]===S.tab)[3]||TABS.find(t=>t[0]===S.tab)[2])}</h1><div style="display:flex;gap:8px;align-items:center">${S.tab==='chats'||S.tab==='contacts'?'<button class="ib" data-act="scan" aria-label="Scan QR code" style="background:var(--in)">📷</button>':''}<div class="logo" style="width:36px;height:36px;font-size:19px;border-radius:12px">Z</div></div></div>${S.tab==='chats'||S.tab==='contacts'||S.tab==='community'?`<input class="srch" id="q" placeholder="Search people and chats" value="${esc(S.q)}">`:''}<div id="list">${listHTML()}</div>${S.tab==='chats'?'<button class="fab" data-act="newmenu" aria-label="New chat or group">＋</button>':S.tab==='community'?'<button class="fab" data-act="cnew" aria-label="Create community">＋</button>':''}<div class="nav">${TABS.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-act="tab" data-t="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join('')}</div></div><div class="main ${S.cur||S.cm?'open':''}">${S.cm?cmHTML():chatHTML()}</div></div>${sheetHTML()}${callHTML()}${svHTML()}${scanHTML()}`;
 const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;
 const v=$('#scv');if(v&&scStream&&v.srcObject!==scStream){v.srcObject=scStream;v.play&&v.play().catch(()=>{})}
 const q=$('#q');if(q&&S.focusQ){q.focus();q.setSelectionRange(99,99)}S.focusQ=0}
function authHTML(){const e=`<div class="err">${esc(S.err)}</div>`;
 if(S.step==='welcome')return `<div class="au"><div class="logo" style="width:68px;height:68px;font-size:38px;border-radius:22px">Z</div><h1>Welcome to Zuno</h1><p>Fast, private messaging for the people you talk to most.</p><div class="tabs"><button class="${S.mode==='phone'?'on':''}" data-act="mode" data-m="phone">Phone</button><button class="${S.mode==='email'?'on':''}" data-act="mode" data-m="email">Email</button></div><input class="fld" id="id" value="${esc(S.id)}" placeholder="${S.mode==='phone'?'+1 555 010 0199':'you@example.com'}" inputmode="${S.mode==='phone'?'tel':'email'}" autocomplete="off">${e}<button class="pri" data-act="sendotp">Continue</button><p style="font-size:12px">We’ll send a 6-digit code to verify it’s you.</p></div>`;
 if(S.step==='otp')return `<div class="au"><h1>Enter your code</h1><p>Sent to ${esc(S.id)}. Demo code: <b>123456</b></p><input class="fld" id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit code" style="letter-spacing:6px;text-align:center;font-size:22px">${e}<button class="pri" data-act="verify">Verify</button><button data-act="back" style="color:var(--mu)">Use a different ${S.mode}</button></div>`;
 return `<div class="au"><h1>Set up your profile</h1><button data-act="avsheet" style="margin:0 auto;display:block" aria-label="Add profile photo">${av({name:(S.me.name||'Z').toUpperCase(),c:'#6c4cff',pic:S.me.pic},84)}</button><button data-act="avsheet" style="color:var(--ac);font-weight:600">${S.me.pic?'Change photo':'Add photo'}</button><input class="fld" id="nm" maxlength="40" placeholder="Display name" value="${esc(S.me.name)}"><input class="fld" id="un" maxlength="20" placeholder="Username (letters, numbers, _)" value="${esc(S.me.user)}"><input class="fld" id="bio" maxlength="80" placeholder="Bio (optional)" value="${esc(S.me.bio)}">${e}<button class="pri" data-act="finish">Start chatting</button></div>`}
function load(){S.loading=true;R();setTimeout(()=>{S.loading=false;R()},700)}
function open(id){S.cur=id;S.cm=null;S.cch=null;const p=byId(id);p.unread=0;S.draft='';S.reply=null;S.tab==='contacts'&&(S.tab='chats');R()}
function push(p,m){p.msgs.push(m);P.splice(P.indexOf(p),1);P.unshift(p)}
function send(kind,text,extra){const p=byId(S.cur);if(!p||S.blocked.includes(p.id))return;
 const m=mk('me',text||'',S.online?'sent':'sent',Object.assign({kind},extra||{}));if(S.reply){m.reply=S.reply.text;S.reply=null}
 push(p,m);S.draft='';R();const inp=$('#msg');inp&&inp.focus();
 if(!S.online)return;
 setTimeout(()=>{m.st='delivered';S.cur===p.id&&R()},600);
 setTimeout(()=>{p.typing=true;p.tw=p.group?byId(p.members[Math.random()*p.members.length|0]).name.split(' ')[0]:'';S.cur===p.id&&R()},1200);
 setTimeout(()=>{m.st=S.set.receipts?'read':'delivered';p.typing=false;const r=mk('them',REPL[Math.random()*REPL.length|0]);if(p.group)r.who=p.tw;push(p,r);if(S.cur!==p.id){p.unread++;}R()},2800)}
function startCall(id,v,inc){S.call={id,v,incoming:inc,mute:false,cam:true,t:0};R()}
function endCall(){clearInterval(timer);const c=S.call;if(c){const p=byId(c.id);S.calls.unshift({n:p.name,d:c.incoming?'missed':'out',v:c.v?1:0,t:'Today, '+now()})}S.call=null;R()}
const A={
 avsheet:()=>{keep();S.sheet={k:'avatar'};R()},
 av_pick:(d)=>{S.me.pic=avUrl(+d.i);S.sheet=null;R()},av_rm:()=>{delete S.me.pic;S.sheet=null;R()},
 cmopen:(d,el,e)=>{if(e.target.closest('[data-act=cjoin]'))return;S.cm=d.id;S.cch=null;S.cur=null;R()},
 cmback:()=>{if(S.cch)S.cch=null;else S.cm=null;R()},
 chopen:(d)=>{S.cch=d.id;S.cdraft='';R()},

 cleave:()=>{const c=cm();c.joined=false;c.admin=false;c.members--;S.cch=null;R()},
 csend:()=>{const i=$('#cmsg'),t=i.value.trim();if(!t)return;const c=cm(),h=c.ch.find(x=>x.id===S.cch);h.msgs.push({id:++uid,who:'me',text:t,time:now()});S.cdraft='';R();$('#cmsg').focus();
  if(!h.ann)setTimeout(()=>{h.msgs.push({id:++uid,who:NM[Math.random()*8|0],text:CREPL[Math.random()*6|0],time:now()});if(S.cch===h.id)R()},1500)},
 cnew:()=>{S.dc={i:0,n:'',d:''};S.sheet={k:'cnew'};R()},
 cpick:(d)=>{S.dc.n=$('#cnm').value;S.dc.d=$('#cds').value;S.dc.i=+d.i;R()},
 cpost:()=>{const n=$('#cnm').value.trim(),ds=$('#cds').value.trim();S.dc.n=n;S.dc.d=ds;const e=$('#cerr');
  if(n.length<3)return e.textContent='Name needs at least 3 characters.';if(C.some(c=>c.name.toLowerCase()===n.toLowerCase()))return e.textContent='That name is already taken.';
  const a=AV[S.dc.i],c=mkC('c'+(++uid),n,a[0],a[1],ds||'A new Zuno community.',1,true,true);C.unshift(c);S.sheet=null;S.tab='community';S.cm=c.id;S.cch=null;S.cur=null;R()},
 chnew:()=>{S.sheet={k:'chnew'};R();setTimeout(()=>{const i=$('#chn');i&&i.focus()},50)},
 chpost:()=>{const n=$('#chn').value.trim(),c=cm(),e=$('#cerr');if(n.length<2)return e.textContent='Name needs at least 2 characters.';if(c.ch.some(h=>h.name.toLowerCase()===n.toLowerCase()))return e.textContent='That channel already exists.';
  c.ch.push({id:c.id+'x'+(++uid),name:n,msgs:[]});S.sheet=null;R()},
 gnew:()=>{S.dg={i:0,n:'',sel:[]};S.sheet={k:'gnew'};R()},
 gpick:(d)=>{keepG();S.dg.i=+d.i;R()},
 gsel:(d)=>{keepG();const k=S.dg.sel.indexOf(d.id);k<0?S.dg.sel.push(d.id):S.dg.sel.splice(k,1);R()},
 gpost:()=>{keepG();const n=S.dg.n.trim(),e=$('#gerr');if(n.length<2)return e.textContent='Group name needs at least 2 characters.';if(S.dg.sel.length<2)return e.textContent='Pick at least 2 people.';
  const a=AV[S.dg.i],g={id:'g'+(++uid),name:n,user:'',c:a[1],pic:avUrl(S.dg.i),group:true,members:S.dg.sel.slice(),online:false,bio:'',unread:0,msgs:[{id:++uid,t:'sys',kind:'sys',text:'You created “'+n+'”',time:now(),st:'read'}]};
  P.unshift(g);S.sheet=null;S.tab='chats';open(g.id);setTimeout(()=>{const m=mk('them','Welcome! 🎉');m.who=byId(g.members[0]).name.split(' ')[0];g.msgs.push(m);if(S.cur!==g.id)g.unread++;R()},1200)},
 ginfo:()=>{S.sheet={k:'ginfo'};R()},gadd:()=>{S.sheet={k:'gadd'};R()},
 gadd2:(d)=>{const g=byId(S.cur);g.members.push(d.id);g.msgs.push({id:++uid,t:'sys',kind:'sys',text:'You added '+byId(d.id).name,time:now(),st:'read'});S.sheet={k:'ginfo'};R()},
 gleave:()=>{const g=byId(S.cur);P.splice(P.indexOf(g),1);S.cur=null;S.sheet=null;R()},
 scan:()=>{S.scan={m:'scan',err:'',last:''};R();scanStart()},
 scclose:()=>{scanStop();S.scan=null;R()},
 scmode:(d)=>{S.scan.m=d.m;S.scan.err='';if(d.m==='mine'){scanStop()}R();if(d.m==='scan')scanStart()},
 scgo:()=>scanResult($('#scm').value),scdemo:()=>scanResult('zuno://u/zara_k'),
 stadd:()=>{clearTimeout(svT);S.sv=null;S.sheet={k:'status'};R();setTimeout(()=>{const i=$('#sttx');i&&i.focus()},50)},
 stbg:(d)=>{S.dst.bg=+d.i;R()},
 stpost:()=>{const t=($('#sttx').value||'').trim();S.dst.text=t;if(!t){$('#sterr').textContent='Write something first.';return}
  S.mine.push({bg:BGS[S.dst.bg],text:t,time:'Just now'});S.dst.text='';S.sheet=null;R()},
 svopen:(d)=>{const l=d.w==='me'?S.mine:byId(d.w).st;if(!l.length)return;S.sv={w:d.w,i:0};R();svStart()},
 svnext:()=>{if(!S.sv)return;const l=svList();if(S.sv.i+1<l.length){S.sv.i++;R();svStart()}else A.svclose()},
 svprev:()=>{if(!S.sv)return;if(S.sv.i>0)S.sv.i--;R();svStart()},
 svclose:()=>{clearTimeout(svT);if(S.sv&&S.sv.w!=='me')S.seen[S.sv.w]=1;S.sv=null;R()},
 stdel:()=>{S.mine.splice(S.sv.i,1);if(!S.mine.length){clearTimeout(svT);S.sv=null}else{S.sv.i=Math.min(S.sv.i,S.mine.length-1);svStart()}R()},
 mode:(d)=>{S.mode=d.m;S.err='';R()},
 sendotp:()=>{const v=$('#id').value.trim();S.id=v;const ok=S.mode==='phone'?/^\+?[\d\s-]{8,16}$/.test(v):/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);S.err=ok?'':S.mode==='phone'?'Enter a valid phone number with country code.':'Enter a valid email address.';if(ok)S.step='otp';R()},
 verify:()=>{if($('#otp').value.trim()==='123456'){S.err='';S.step='profile'}else S.err='That code is incorrect. Try 123456.';R()},
 back:()=>{S.step='welcome';S.err='';R()},
 finish:()=>{const n=$('#nm').value.trim(),u=$('#un').value.trim(),b=$('#bio').value.trim();S.me=Object.assign(S.me,{name:n,user:u,bio:b});
  if(n.length<2)S.err='Enter your name (2+ characters).';else if(!/^[a-zA-Z0-9_]{3,20}$/.test(u))S.err='Username needs 3–20 letters, numbers or _.';else if(P.some(p=>p.user===u.toLowerCase()))S.err='That username is taken.';else{S.err='';S.step='app';return load()}R()},
 tab:(d)=>{S.tab=d.t;S.q='';R()},open:(d)=>open(d.id),close:()=>{S.cur=null;R()},
 newchat:()=>{S.sheet=null;S.tab='contacts';R()},
 menu:(d)=>{S.sheet={k:'menu',id:+d.id};R()},sheetx:(d,el,e)=>{if(e.target===el){S.sheet=null;R()}},
 m_reply:(d)=>{const m=byId(S.cur).msgs.find(x=>x.id==d.id);S.reply={text:pre(m)};S.sheet=null;R();$('#msg')&&$('#msg').focus()},
 m_copy:(d)=>{const m=byId(S.cur).msgs.find(x=>x.id==d.id);try{navigator.clipboard.writeText(m.text||pre(m))}catch(e){}S.sheet=null;R()},
 m_fwd:(d)=>{S.sheet={k:'fwd',id:+d.id};R()},
 m_del:(d)=>{const p=byId(S.cur);p.msgs=p.msgs.filter(x=>x.id!=d.id);S.sheet=null;R()},
 fwdto:(d)=>{const src=byId(S.cur).msgs.find(x=>x.id==d.m),t=byId(d.id);push(t,Object.assign({},src,{id:++uid,t:'me',st:'sent',time:now(),reply:null}));S.sheet=null;R()},
 noreply:()=>{S.reply=null;R()},
 emoji:()=>$('#em').classList.toggle('on'),emo:(d)=>{const i=$('#msg');i.value+=d.e;i.dispatchEvent(new Event('input'));i.focus()},
 send:()=>{const t=$('#msg').value.trim();t&&send('text',t)},
 voice:()=>send('voice'),attach:()=>{S.sheet={k:'attach'};R()},
 send_photo:()=>{S.sheet=null;send('photo')},send_video:()=>{S.sheet=null;send('video')},send_voice:()=>{S.sheet=null;send('voice')},send_file:()=>{S.sheet=null;send('file','',{name:'document.pdf'})},
 more:()=>{S.sheet={k:'more'};R()},
 block:()=>{const i=S.cur,k=S.blocked.indexOf(i);k<0?S.blocked.push(i):S.blocked.splice(k,1);S.sheet=null;R()},
 report:()=>{S.sheet={k:'info',t:'Report sent',d:'Thanks. Our team will review this account.'};R()},
 clear:()=>{byId(S.cur).msgs=[];S.sheet=null;R()},
 blocked:()=>{S.sheet={k:'blocked'};R()},unb:(d)=>{S.blocked=S.blocked.filter(x=>x!==d.id);R();S.sheet={k:'blocked'};R()},
 info:(d)=>{const a=d.t.split('|');S.sheet={k:'info',t:a[0],d:a[1]};R()},
 tg:(d)=>{if(d.k==='dark'){const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'}else S.set[d.k]=!S.set[d.k];R()},
 logout:()=>{S.step='welcome';S.id='';S.cur=null;S.tab='chats';S.me={name:'',user:'',bio:''};R()},
 call:()=>startCall(S.cur,0),vcall:()=>startCall(S.cur,1),callname:(d)=>startCall(P.find(p=>p.name===d.n).id,0),
 incoming:()=>startCall('u0',1,true),
 accept:()=>{S.call.incoming=false;R();const s=Date.now();timer=setInterval(()=>{const t=(Date.now()-s)/1000|0,e=$('#ctm');e&&(e.textContent=(S.call.v&&S.call.cam?'Video call · ':'')+(t/60|0)+':'+String(t%60).padStart(2,'0'))},1000)},
 mute:()=>{S.call.mute=!S.call.mute;R()},cam:()=>{S.call.cam=!S.call.cam;R()},endcall:endCall};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&A[el.dataset.act])A[el.dataset.act](el.dataset,el,e)});
document.addEventListener('input',e=>{
 if(e.target.id==='q'){S.q=e.target.value;$('#list').innerHTML=listHTML()}
 if(e.target.id==='cmsg')S.cdraft=e.target.value;
 if(e.target.id==='sttx'){S.dst.text=e.target.value;$('#stpv').textContent=e.target.value||'Type something…'}
 if(e.target.id==='msg'){S.draft=e.target.value;const b=$('#sb'),t=S.draft.trim();b.textContent=t?'➤':'🎤';b.dataset.act=t?'send':'voice'}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='msg'){e.preventDefault();A.send()}if(e.key==='Enter'&&e.target.id==='cmsg'){e.preventDefault();A.csend()}});
addEventListener('online',()=>{S.online=true;R()});addEventListener('offline',()=>{S.online=false;R()});
$('#pf').addEventListener('change',e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 const fail=m=>{if(S.step==='profile'){S.err=m;R()}else{S.sheet={k:'info',t:'Couldn’t update photo',d:m};R()}};
 if(f.type&&!f.type.startsWith('image/'))return fail('Choose an image file (JPG, PNG or WebP).');
 if(f.size>8e6)return fail('That image is over 8 MB. Choose a smaller one.');
 const img=new Image(),url=URL.createObjectURL(f);
 img.onerror=()=>{URL.revokeObjectURL(url);fail('That file couldn’t be read as an image.')};
 img.onload=()=>{const z=256,c=document.createElement('canvas');c.width=c.height=z;const k=Math.min(img.width,img.height),x=(img.width-k)/2,y=(img.height-k)/2;
  c.getContext('2d').drawImage(img,x,y,k,k,0,0,z,z);URL.revokeObjectURL(url);
  if(S.step==='profile'){const v=i=>($('#'+i)||{}).value||'';S.me.name=v('nm');S.me.user=v('un');S.me.bio=v('bio');S.err=''}
  S.me.pic=c.toDataURL('image/jpeg',.85);S.sheet=null;R()};
 img.src=url});
R();
